repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        language: system
        entry: >-
          trufflehog git file://.
          --since-commit HEAD
          --trust-local-git-config
          --no-verification
          --results=verified,unverified,unknown
          --fail
        pass_filenames: false
        stages: [pre-commit]
